name: Fabric generation audit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fabric-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generation:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Generate, save and reopen the native Fabric world
        run: python3 tests/fabric_smoke.py --java java --mod mods/FreshGenerator-00093076.jar --config tests/pinned_config.json --work .audit-world --max-seconds 900
      - name: Publish evidence in logs and job summary
        if: always()
        run: python3 tests/ci_report.py .audit-world
  generation-order:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Compare native generation in forward and reverse order
        run: python3 tests/generation_order.py --java java --mod mods/FreshGenerator-00093076.jar --work .audit-order --max-seconds 900

